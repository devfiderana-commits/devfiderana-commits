name: Generate Snake Game

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  generate-snake-game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Snake Game from GitHub Contribution Grid
        uses: Platane/snk@v3.3.0
        with:
          github_user_name: Rajath2005
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            futuristic-dark.svg?palette=github-dark&color_snake=#00FFAB&color_dots=#1B1F23,#2C2F33,#3D4148,#4E525D,#5F6372
            sleek-light.svg?palette=github-light&color_snake=#007ACC&color_dots=#E0F7FA,#B2EBF2,#81D4FA,#4FC3F7,#29B6F6
            cosmic-ocean.gif?palette=github&color_snake=#FF6F61&color_dots=#FFD700,#FFA500,#FF8C00,#FF7F50,#FF6347

      - name: Commit generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.svg *.gif
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update generated snake game outputs"
            git push
          fi
