name: 🐍 Generate Contribution Snake Animation

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake Animations
        uses: Platane/snk@v3.3.0
        with:
          github_user_name: Rajath2005
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/snake-dark.svg?palette=github-dark&color_snake=#FFFFFF&color_dots=#0D1117,#052e16,#166534,#22c55e,#39FF14
            assets/snake-light.svg?palette=github&color_snake=#FFFFFF&color_dots=#ebedf0,#c6e48b,#7bc96f,#239a3b,#196127

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/snake-*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🐍 Update snake animations [$(date +'%Y-%m-%d')]"
            git pull --rebase
            git push
          fi
