name: 📈 Generate Metrics

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'   # Daily at 1am UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GitHub Metrics — Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rajath2005
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Asia/Kolkata
          filename: assets/metrics-isocalendar.svg
          config_output: svg
          config_padding: 0, 8
          config_display: regular

      - name: GitHub Metrics — Language Activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rajath2005
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          config_timezone: Asia/Kolkata
          filename: assets/metrics-languages.svg
          config_output: svg
          config_padding: 0, 8

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/metrics-*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "📈 Update metrics SVGs [$(date +'%Y-%m-%d')]"
            git push
          fi
