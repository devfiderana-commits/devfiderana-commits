<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Fanilo Fiderana banner</title>
  <desc id="desc">Bannière moderne du portfolio de Fanilo Fiderana, développeur web backend et IA.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08111b"/>
      <stop offset="50%" stop-color="#0d1725"/>
      <stop offset="100%" stop-color="#0b1320"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#59f3d3"/>
      <stop offset="50%" stop-color="#74c7ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#59f3d3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="364" rx="24" fill="rgba(15,23,42,0.62)" stroke="rgba(148,163,184,0.22)"/>

  <g opacity="0.22" stroke="#74c7ff" stroke-width="1">
    <path d="M80 120H1120M80 180H1120M80 240H1120M80 300H1120"/>
    <path d="M220 80V340M420 80V340M620 80V340M820 80V340M1020 80V340"/>
  </g>

  <rect x="68" y="68" width="300" height="4" rx="2" fill="url(#panel)"/>

  <g transform="translate(80 115)">
    <text x="0" y="0" fill="#e2e8f0" font-size="22" font-weight="700" letter-spacing="7" font-family="Segoe UI, Arial, sans-serif">RATIARISON</text>
    <text x="0" y="68" fill="#59f3d3" font-size="58" font-weight="800" letter-spacing="-2" font-family="Segoe UI, Arial, sans-serif">FANILO</text>
    <text x="0" y="122" fill="#dfeaf6" font-size="36" font-weight="600" letter-spacing="2" font-family="Segoe UI, Arial, sans-serif">FIDERANA</text>
    <text x="0" y="170" fill="#94a3b8" font-size="20" font-weight="500" letter-spacing="4" font-family="Segoe UI, Arial, sans-serif">INFORMATICIEN</text>
  </g>

  <g transform="translate(780 120)">
    <circle cx="180" cy="110" r="120" fill="url(#accent)" filter="url(#softGlow)"/>
    <circle cx="180" cy="110" r="82" fill="rgba(11,17,26,0.9)" stroke="#59f3d3" stroke-width="1.5"/>
    <circle cx="180" cy="110" r="58" fill="rgba(19,32,49,0.9)" stroke="#74c7ff" stroke-width="1.25"/>
    <path d="M180 48L205 94L180 138L155 94Z" fill="none" stroke="#59f3d3" stroke-width="2.2"/>
    <path d="M128 110H232M180 58V162" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="6 8"/>
    <circle cx="180" cy="110" r="12" fill="#59f3d3"/>
    <text x="180" y="210" fill="#cbd5e1" font-size="18" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" letter-spacing="3">WEB • BACKEND • IA</text>
  </g>

  <g transform="translate(90 280)">
    <rect x="0" y="0" width="385" height="46" rx="23" fill="rgba(15,23,42,0.7)" stroke="rgba(116,199,255,0.35)"/>
    <circle cx="28" cy="23" r="7" fill="#59f3d3"/>
    <text x="56" y="29" fill="#e2e8f0" font-size="17" font-family="Segoe UI, Arial, sans-serif">Développement Web • Backend • IA</text>
  </g>
</svg>
