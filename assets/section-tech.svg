<svg xmlns="http://www.w3.org/2000/svg" width="600" height="50" viewBox="0 0 600 50">
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFD1">
        <animate attributeName="stop-color" values="#00FFD1;#00D4FF;#7B61FF;#00FFD1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#7B61FF">
        <animate attributeName="stop-color" values="#7B61FF;#00FFD1;#00D4FF;#7B61FF" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="0" y="44" width="600" height="1" fill="url(#tg)" opacity="0.3"/>
  <text x="40" y="32" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="url(#tg)" filter="url(#g)">⚡ Tech Arsenal</text>
  <circle cx="16" cy="25" r="4" fill="#00FFD1" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;5;4" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
