<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64">
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00FFD1"><animate attributeName="stop-color" values="#00FFD1;#00D4FF;#7B61FF;#00FFD1" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#7B61FF"><animate attributeName="stop-color" values="#7B61FF;#00FFD1;#00D4FF;#7B61FF" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="40%"  stop-color="#00FFD1" stop-opacity="0.3"/>
      <stop offset="60%"  stop-color="#00FFD1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="scan"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Scanning line sweep -->
  <rect x="-120" y="0" width="120" height="64" fill="url(#scanGrad)" opacity="0.5" filter="url(#scan)">
    <animate attributeName="x" values="-120;900;-120" dur="4.5s" repeatCount="indefinite" calcMode="ease-in-out"/>
  </rect>

  <!-- Bottom underline -->
  <rect x="0" y="60" width="900" height="1" fill="url(#tg)" opacity="0.25"/>

  <!-- Pulsing dot indicator -->
  <circle cx="18" cy="32" r="5" fill="#00FFD1" opacity="0.7" filter="url(#g)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;6.5;5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="18" cy="32" r="10" fill="#00FFD1" opacity="0.1">
    <animate attributeName="r" values="10;16;10" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0;0.1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Title -->
  <text x="38" y="40" font-family="'Segoe UI', 'SF Pro Display', sans-serif" font-size="26" font-weight="700" fill="url(#tg)" filter="url(#g)">⚡ Tech Arsenal</text>

  <!-- Section annotation -->
  <text x="882" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#30363D" text-anchor="end" letter-spacing="1">[ TECH_STACK ]</text>
</svg>
