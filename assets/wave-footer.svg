<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130">
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#060d18"/>
      <stop offset="30%"  stop-color="#0a1628">
        <animate attributeName="stop-color" values="#0a1628;#0f1d30;#0a1628" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="70%"  stop-color="#39FF14" stop-opacity="0.08">
        <animate attributeName="stop-opacity" values="0.08;0.15;0.08" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#060d18"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0a1628" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#7B61FF" stop-opacity="0.06">
        <animate attributeName="stop-opacity" values="0.06;0.12;0.06" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#060d18"/>
      <stop offset="40%"  stop-color="#00D4FF" stop-opacity="0.05">
        <animate attributeName="stop-opacity" values="0.05;0.10;0.05" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#060d18"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="20%"  stop-color="#39FF14">
        <animate attributeName="stop-color" values="#39FF14;#7B61FF;#00D4FF;#39FF14" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="80%"  stop-color="#7B61FF">
        <animate attributeName="stop-color" values="#7B61FF;#00D4FF;#39FF14;#7B61FF" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="waveGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="130" fill="#060d18"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="1.5" fill="url(#topLine)" filter="url(#waveGlow)"/>

  <!-- Traveling dot on top line -->
  <circle r="2.5" fill="#39FF14" opacity="0.8" filter="url(#waveGlow)" cy="0.75">
    <animate attributeName="cx" values="0;1200;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.8" fill="#7B61FF" opacity="0.6" filter="url(#waveGlow)" cy="0.75">
    <animate attributeName="cx" values="1200;0;1200" dur="6.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Wave layer 1 (deep, slow) -->
  <path fill="url(#waveGrad1)" opacity="0.9">
    <animate attributeName="d" dur="12s" repeatCount="indefinite" values="
      M 0 60 C 150 20, 350 90, 600 50 C 850 10, 1050 80, 1200 45 L 1200 130 L 0 130 Z;
      M 0 50 C 200 90, 400 20, 600 65 C 800 110, 1000 30, 1200 60 L 1200 130 L 0 130 Z;
      M 0 60 C 150 20, 350 90, 600 50 C 850 10, 1050 80, 1200 45 L 1200 130 L 0 130 Z
    "/>
  </path>

  <!-- Wave layer 2 (mid, medium) -->
  <path fill="url(#waveGrad2)" opacity="0.7">
    <animate attributeName="d" dur="9s" repeatCount="indefinite" values="
      M 0 75 C 100 45, 300 100, 500 65 C 700 30, 900 90, 1200 55 L 1200 130 L 0 130 Z;
      M 0 65 C 150 95, 350 40, 600 75 C 850 110, 1050 50, 1200 70 L 1200 130 L 0 130 Z;
      M 0 75 C 100 45, 300 100, 500 65 C 700 30, 900 90, 1200 55 L 1200 130 L 0 130 Z
    "/>
  </path>

  <!-- Wave layer 3 (front, fast) -->
  <path fill="url(#waveGrad3)" opacity="0.6">
    <animate attributeName="d" dur="6s" repeatCount="indefinite" values="
      M 0 85 C 200 60, 400 105, 600 80 C 800 55, 1000 95, 1200 70 L 1200 130 L 0 130 Z;
      M 0 78 C 180 100, 380 65, 600 88 C 820 110, 1020 72, 1200 82 L 1200 130 L 0 130 Z;
      M 0 85 C 200 60, 400 105, 600 80 C 800 55, 1000 95, 1200 70 L 1200 130 L 0 130 Z
    "/>
  </path>

  <!-- Star field in footer -->
  <circle cx="80"  cy="100" r="0.7" fill="#E6EDF3" opacity="0"><animate attributeName="opacity" values="0;0.4;0" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="90"  r="0.9" fill="#39FF14" opacity="0"><animate attributeName="opacity" values="0;0.5;0" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="340" cy="110" r="0.6" fill="#E6EDF3" opacity="0"><animate attributeName="opacity" values="0;0.3;0" dur="4.0s" begin="0.8s" repeatCount="indefinite"/></circle>
  <circle cx="460" cy="95"  r="0.8" fill="#7B61FF" opacity="0"><animate attributeName="opacity" values="0;0.4;0" dur="3.5s" begin="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="115" r="1.0" fill="#E6EDF3" opacity="0"><animate attributeName="opacity" values="0;0.6;0" dur="2.6s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="720" cy="88"  r="0.7" fill="#00D4FF" opacity="0"><animate attributeName="opacity" values="0;0.4;0" dur="3.9s" begin="1.7s" repeatCount="indefinite"/></circle>
  <circle cx="840" cy="108" r="0.8" fill="#E6EDF3" opacity="0"><animate attributeName="opacity" values="0;0.5;0" dur="3.3s" begin="0.9s" repeatCount="indefinite"/></circle>
  <circle cx="970" cy="92"  r="0.6" fill="#FFD700" opacity="0"><animate attributeName="opacity" values="0;0.4;0" dur="4.1s" begin="1.4s" repeatCount="indefinite"/></circle>
  <circle cx="1100" cy="105" r="0.9" fill="#E6EDF3" opacity="0"><animate attributeName="opacity" values="0;0.5;0" dur="2.9s" begin="2.3s" repeatCount="indefinite"/></circle>

  <!-- Center footer text -->
  <text x="600" y="38" font-family="'JetBrains Mono', monospace" font-size="11" fill="#484F58" text-anchor="middle" letter-spacing="2">✦ crafted with</text>
  <text x="600" y="54" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#39FF14" text-anchor="middle" filter="url(#waveGlow)" opacity="0.85">passion + precision</text>
  <text x="600" y="70" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#30363D" text-anchor="middle" letter-spacing="1">"All learning should be interesting and enjoyable."</text>
</svg>
