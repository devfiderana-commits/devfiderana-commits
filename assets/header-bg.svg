<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" class="svg-harmonized" role="img" focusable="false" preserveAspectRatio="xMidYMid meet" aria-labelledby="title">
  <title id="title">Header background</title>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="30%" style="stop-color:#0a1628"/>
      <stop offset="70%" style="stop-color:#0d2137"/>
      <stop offset="100%" style="stop-color:#0D1117"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#59f3d3">
        <animate attributeName="stop-color" values="#59f3d3;#74c7ff;#8b5cf6;#59f3d3" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#74c7ff">
        <animate attributeName="stop-color" values="#74c7ff;#8b5cf6;#59f3d3;#74c7ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#59f3d3;#74c7ff;#8b5cf6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="headerGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Star/sparkle shape -->
    <polygon id="sparkle" points="6,0 7.5,4.5 12,6 7.5,7.5 6,12 4.5,7.5 0,6 4.5,4.5" fill="url(#accentGrad)"/>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="200" fill="url(#headerGrad)"/>
  
  <!-- Animated grid lines (subtle) -->
  <g opacity="0.08" stroke="#74c7ff">
    <line x1="0" y1="40" x2="1200" y2="40" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="1200" y2="80" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="200" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="200" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="200" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="200" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="200" stroke-width="0.5"/>
  </g>
  
  <!-- Animated orbs / bokeh -->
  <circle cx="150" cy="60" r="40" fill="#59f3d3" opacity="0.04" filter="url(#softGlow)">
    <animate attributeName="cx" values="150;180;150" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="r" values="40;55;40" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="140" r="50" fill="#8b5cf6" opacity="0.05" filter="url(#softGlow)">
    <animate attributeName="cx" values="1050;1020;1050" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="r" values="50;65;50" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="100" r="35" fill="#74c7ff" opacity="0.04" filter="url(#softGlow)">
    <animate attributeName="cy" values="100;80;100" dur="7s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Sparkles -->
  <use href="#sparkle" x="80" y="30" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 86 36;360 86 36" dur="6s" repeatCount="indefinite"/>
  </use>
  <use href="#sparkle" x="1080" y="25" opacity="0.4" transform="scale(0.7)">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 1086 31;360 1086 31" dur="8s" repeatCount="indefinite"/>
  </use>
  <use href="#sparkle" x="950" y="160" opacity="0.3" transform="scale(0.5)">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 956 166;360 956 166" dur="5s" repeatCount="indefinite"/>
  </use>
  <use href="#sparkle" x="250" y="150" opacity="0.4" transform="scale(0.6)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 256 156;360 256 156" dur="7s" repeatCount="indefinite"/>
  </use>
  
  <!-- Main accent line - animated gradient -->
  <rect x="200" y="185" width="800" height="2" rx="1" fill="url(#accentGrad)" filter="url(#headerGlow)" opacity="0.6">
    <animate attributeName="width" values="800;850;800" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="200;175;200" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Corner accents -->
  <path d="M0,0 L60,0 L0,60 Z" fill="url(#accentGrad)" opacity="0.06"/>
  <path d="M1200,0 L1140,0 L1200,60 Z" fill="url(#accentGrad)" opacity="0.06"/>
  
  <!-- Floating dots trail -->
  <circle cx="400" cy="50" r="1.5" fill="#59f3d3" opacity="0.5">
    <animate attributeName="cx" values="400;420;400" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="150" r="1" fill="#8b5cf6" opacity="0.35">
    <animate attributeName="cy" values="150;130;150" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="40" r="1.5" fill="#74c7ff" opacity="0.35">
    <animate attributeName="cx" values="750;770;750" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="120" r="1" fill="#74c7ff" opacity="0.4">
    <animate attributeName="cy" values="120;100;120" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="90" r="1.2" fill="#59f3d3" opacity="0.35">
    <animate attributeName="cx" values="850;870;850" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
