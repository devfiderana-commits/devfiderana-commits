<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64">
  <defs>
    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFD700"><animate attributeName="stop-color" values="#FFD700;#39FF14;#7B61FF;#FFD700" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#39FF14"><animate attributeName="stop-color" values="#39FF14;#7B61FF;#FFD700;#39FF14" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="scanGs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="40%"  stop-color="#FFD700" stop-opacity="0.3"/>
      <stop offset="60%"  stop-color="#FFD700" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="gs"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="scans"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="-120" y="0" width="120" height="64" fill="url(#scanGs)" opacity="0.5" filter="url(#scans)">
    <animate attributeName="x" values="-120;900;-120" dur="5.5s" repeatCount="indefinite" calcMode="ease-in-out"/>
  </rect>
  <rect x="0" y="60" width="900" height="1" fill="url(#sg)" opacity="0.25"/>
  <circle cx="18" cy="32" r="5" fill="#FFD700" opacity="0.7" filter="url(#gs)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;6.5;5" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="18" cy="32" r="10" fill="#FFD700" opacity="0.1">
    <animate attributeName="r" values="10;16;10" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0;0.1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="38" y="40" font-family="'Segoe UI', 'SF Pro Display', sans-serif" font-size="26" font-weight="700" fill="url(#sg)" filter="url(#gs)">📊 GitHub Analytics</text>
  <text x="882" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#30363D" text-anchor="end" letter-spacing="1">[ ANALYTICS ]</text>
</svg>
