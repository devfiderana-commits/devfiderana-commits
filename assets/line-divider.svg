<svg width="1200" height="12" viewBox="0 0 1200 12" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:0"/>
      <stop offset="15%" style="stop-color:#00FFD1;stop-opacity:0.8">
        <animate attributeName="stop-color" values="#00FFD1;#7B61FF;#00D4FF;#00FFD1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#7B61FF;stop-opacity:1">
        <animate attributeName="stop-color" values="#7B61FF;#00D4FF;#FFD700;#7B61FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="85%" style="stop-color:#00D4FF;stop-opacity:0.8">
        <animate attributeName="stop-color" values="#00D4FF;#00FFD1;#7B61FF;#00D4FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:0"/>
    </linearGradient>
    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Glow line -->
  <rect x="50" y="4" width="1100" height="2" rx="1" fill="url(#lineGrad)" filter="url(#lineGlow)" opacity="0.8"/>
  
  <!-- Bright core -->
  <rect x="100" y="5" width="1000" height="1" rx="0.5" fill="url(#lineGrad)" opacity="0.5"/>
  
  <!-- Traveling light dot -->
  <circle r="3" fill="#00FFD1" opacity="0.9" filter="url(#lineGlow)">
    <animate attributeName="cx" values="100;1100;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="6;6;6" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Second traveling dot (reverse) -->
  <circle r="2" fill="#7B61FF" opacity="0.6" filter="url(#lineGlow)">
    <animate attributeName="cx" values="1100;100;1100" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="6;6;6" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
