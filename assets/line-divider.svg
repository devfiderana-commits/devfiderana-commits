<svg width="1200" height="12" viewBox="0 0 1200 12" xmlns="http://www.w3.org/2000/svg" class="svg-harmonized" role="img" focusable="false" preserveAspectRatio="xMidYMid meet" aria-labelledby="title">
  <title id="title">Divider</title>
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#050b16;stop-opacity:0"/>
      <stop offset="15%" style="stop-color:#59f3d3;stop-opacity:0.8">
        <animate attributeName="stop-color" values="#59f3d3;#74c7ff;#8b5cf6;#59f3d3" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#74c7ff;stop-opacity:1">
        <animate attributeName="stop-color" values="#74c7ff;#8b5cf6;#59f3d3;#74c7ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="85%" style="stop-color:#8b5cf6;stop-opacity:0.8">
        <animate attributeName="stop-color" values="#8b5cf6;#59f3d3;#74c7ff;#8b5cf6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#050b16;stop-opacity:0"/>
    </linearGradient>
    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Glow line -->
  <rect x="50" y="4" width="1100" height="2" rx="1" fill="url(#lineGrad)" filter="url(#lineGlow)" opacity="0.8"/>
  
  <!-- Bright core -->
  <rect x="100" y="5" width="1000" height="1" rx="0.5" fill="url(#lineGrad)" opacity="0.5"/>
  
  <!-- Traveling light dot -->
  <circle r="3" fill="#59f3d3" opacity="0.9" filter="url(#lineGlow)">
    <animate attributeName="cx" values="100;1100;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="6;6;6" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Second traveling dot (reverse) -->
  <circle r="2" fill="#8b5cf6" opacity="0.6" filter="url(#lineGlow)">
    <animate attributeName="cx" values="1100;100;1100" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="6;6;6" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
