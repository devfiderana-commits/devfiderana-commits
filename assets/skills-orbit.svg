<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="820" height="420" viewBox="0 0 820 420">
  <defs>
    <!-- Core gradients -->
    <radialGradient id="coreBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a0a2e"/>
      <stop offset="40%"  stop-color="#0d1628"/>
      <stop offset="100%" stop-color="#060b16"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00FFD1">
        <animate attributeName="stop-color" values="#00FFD1;#00D4FF;#7B61FF;#00FFD1" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7B61FF">
        <animate attributeName="stop-color" values="#7B61FF;#00FFD1;#00D4FF;#7B61FF" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="centerPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00FFD1" stop-opacity="0.25"/>
      <stop offset="60%"  stop-color="#7B61FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <radialGradient id="nodeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a1f35"/>
      <stop offset="100%" stop-color="#0f1422"/>
    </radialGradient>

    <!-- Orbit ring gradients -->
    <linearGradient id="ring1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00FFD1" stop-opacity="0.7">
        <animate attributeName="stop-opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%"  stop-color="#00D4FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00FFD1" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="ring2Grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7B61FF" stop-opacity="0.6">
        <animate attributeName="stop-opacity" values="0.6;0.9;0.6" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%"  stop-color="#00D4FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="ring3Grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFD700" stop-opacity="0.5">
        <animate attributeName="stop-opacity" values="0.5;0.8;0.5" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%"  stop-color="#FF9500" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip -->
    <clipPath id="svgBounds"><rect width="820" height="420"/></clipPath>

    <!-- Orbit paths (for animateMotion) — centered at 410,210 -->
    <!-- Inner ring r=120 -->
    <path id="orbit1" d="M 530,210 A 120,120 0 1,1 529.9,210 Z"/>
    <!-- Mid ring r=185 -->
    <path id="orbit2" d="M 595,210 A 185,185 0 1,1 594.9,210 Z"/>
    <!-- Outer ring r=195 (slightly elliptical for perspective) -->
    <path id="orbit3" d="M 605,210 A 195,195 0 1,1 604.9,210 Z"/>
  </defs>

  <rect width="820" height="420" fill="url(#coreBg)"/>

  <!-- Background dot grid -->
  <pattern id="bgDots" width="25" height="25" patternUnits="userSpaceOnUse">
    <circle cx="12.5" cy="12.5" r="0.5" fill="#7B61FF" opacity="0.08"/>
  </pattern>
  <rect width="820" height="420" fill="url(#bgDots)"/>

  <!-- Ambient pulsing rings in background -->
  <circle cx="410" cy="210" r="240" fill="none" stroke="#00FFD1" stroke-width="0.4" opacity="0.06">
    <animate attributeName="r" values="240;255;240" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.06;0.12;0.06" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="410" cy="210" r="270" fill="none" stroke="#7B61FF" stroke-width="0.3" opacity="0.05">
    <animate attributeName="r" values="270;285;270" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- ===================== ORBIT RINGS ===================== -->

  <!-- Ring 1 — Inner (teal, 120r) — clockwise 50s -->
  <circle cx="410" cy="210" r="120" fill="none" stroke="url(#ring1Grad)" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.55">
    <animateTransform attributeName="transform" type="rotate" values="0 410 210;360 410 210" dur="50s" repeatCount="indefinite"/>
  </circle>

  <!-- Ring 2 — Mid (violet, 185r) — counter 80s -->
  <circle cx="410" cy="210" r="185" fill="none" stroke="url(#ring2Grad)" stroke-width="1.0" stroke-dasharray="4 7" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" values="0 410 210;-360 410 210" dur="80s" repeatCount="indefinite"/>
  </circle>

  <!-- Ring 3 — Outer (gold, 195r) — clockwise 110s -->
  <circle cx="410" cy="210" r="195" fill="none" stroke="url(#ring3Grad)" stroke-width="0.8" stroke-dasharray="3 9" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" values="0 410 210;360 410 210" dur="110s" repeatCount="indefinite"/>
  </circle>

  <!-- Ring labels (static, dimmed) -->
  <text x="530" y="93"  font-family="'JetBrains Mono', monospace" font-size="8" fill="#00FFD1" opacity="0.35" letter-spacing="2">FRONTEND</text>
  <text x="592" y="28"  font-family="'JetBrains Mono', monospace" font-size="8" fill="#7B61FF" opacity="0.35" letter-spacing="2">BACKEND</text>
  <text x="600" y="18"  font-family="'JetBrains Mono', monospace" font-size="8" fill="#FFD700" opacity="0.30" letter-spacing="2">CLOUD + TOOLS</text>

  <!-- ===================== CENTER CORE ===================== -->
  <!-- Core glow -->
  <circle cx="410" cy="210" r="70" fill="url(#centerPulse)" filter="url(#coreGlow)">
    <animate attributeName="r" values="70;80;70" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- Core circle -->
  <circle cx="410" cy="210" r="52" fill="#0f1422" stroke="#00FFD1" stroke-width="1.5" opacity="0.9"/>
  <circle cx="410" cy="210" r="52" fill="none" stroke="#00FFD1" stroke-width="1.5" filter="url(#coreGlow)" opacity="0.5">
    <animate attributeName="r" values="52;55;52" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- Inner ring decoration -->
  <circle cx="410" cy="210" r="44" fill="none" stroke="#7B61FF" stroke-width="0.6" stroke-dasharray="3 4" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" values="0 410 210;360 410 210" dur="20s" repeatCount="indefinite"/>
  </circle>
  <!-- Center text -->
  <text x="410" y="204" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="url(#nameGrad)" text-anchor="middle" filter="url(#textGlow)" letter-spacing="2">RAJATH</text>
  <text x="410" y="222" font-family="'JetBrains Mono', monospace" font-size="9" fill="#484F58" text-anchor="middle" letter-spacing="3">KIRAN A</text>

  <!-- ===================== INNER RING NODES (Frontend) ===================== -->
  <!-- 4 nodes on r=120: React (0°), Next.js (90°), CSS/HTML (180°), TypeScript (270°) -->
  <!-- React @ 0° → cx=530 cy=210 -->
  <g filter="url(#nodeGlow)">
    <animateMotion dur="50s" repeatCount="indefinite"><mpath xlink:href="#orbit1"/></animateMotion>
    <circle r="0" fill="transparent"/>
  </g>

  <!-- Static nodes (positioned manually at orbit1 points, rotating group) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 410 210;360 410 210" dur="50s" repeatCount="indefinite"/>

    <!-- React @ top (270° = cx410, cy90) -->
    <circle cx="410" cy="90" r="22" fill="url(#nodeBg)" stroke="#00FFD1" stroke-width="1.2"/>
    <circle cx="410" cy="90" r="22" fill="none" stroke="#00FFD1" stroke-width="1.2" filter="url(#nodeGlow)" opacity="0.5"/>
    <text x="410" cy="90" y="94" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#61DAFB" text-anchor="middle">⚛ React</text>

    <!-- Next.js @ right (0° = cx530 cy210) -->
    <circle cx="530" cy="210" r="22" fill="url(#nodeBg)" stroke="#00FFD1" stroke-width="1.2"/>
    <circle cx="530" cy="210" r="22" fill="none" stroke="#00FFD1" stroke-width="1.2" filter="url(#nodeGlow)" opacity="0.5"/>
    <text x="530" y="214" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#E6EDF3" text-anchor="middle">▲ Next.js</text>

    <!-- Tailwind @ bottom (90° = cx410 cy330) -->
    <circle cx="410" cy="330" r="22" fill="url(#nodeBg)" stroke="#06B6D4" stroke-width="1.2"/>
    <circle cx="410" cy="330" r="22" fill="none" stroke="#06B6D4" stroke-width="1.2" filter="url(#nodeGlow)" opacity="0.5"/>
    <text x="410" y="334" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#06B6D4" text-anchor="middle">🌊 Tailwind</text>

    <!-- TypeScript @ left (180° = cx290 cy210) -->
    <circle cx="290" cy="210" r="22" fill="url(#nodeBg)" stroke="#3178C6" stroke-width="1.2"/>
    <circle cx="290" cy="210" r="22" fill="none" stroke="#3178C6" stroke-width="1.2" filter="url(#nodeGlow)" opacity="0.5"/>
    <text x="290" y="214" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#3178C6" text-anchor="middle">TS TypeScript</text>
  </g>

  <!-- ===================== MID RING NODES (Backend, r=185) ===================== -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 410 210;-360 410 210" dur="80s" repeatCount="indefinite"/>

    <!-- Node.js @ 315° ≈ cx541, cy79 -->
    <circle cx="541" cy="79" r="24" fill="url(#nodeBg)" stroke="#339933" stroke-width="1.2"/>
    <circle cx="541" cy="79" r="24" fill="none" stroke="#339933" stroke-width="1.2" filter="url(#nodeGlow)" opacity="0.45"/>
    <text x="541" y="83" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#339933" text-anchor="middle">⬡ Node.js</text>

    <!-- MongoDB @ 45° ≈ cx279, cy79 -->
    <circle cx="279" cy="79" r="24" fill="url(#nodeBg)" stroke="#47A248" stroke-width="1.2"/>
    <circle cx="279" cy="79" r="24" fill="none" stroke="#47A248" stroke-width="1.2" filter="url(#nodeGlow)" opacity="0.45"/>
    <text x="279" y="83" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#47A248" text-anchor="middle">🍃 MongoDB</text>

    <!-- Express @ 135° ≈ cx279, cy341 -->
    <circle cx="279" cy="341" r="24" fill="url(#nodeBg)" stroke="#8B949E" stroke-width="1.2"/>
    <circle cx="279" cy="341" r="24" fill="none" stroke="#8B949E" stroke-width="1.2" filter="url(#nodeGlow)" opacity="0.45"/>
    <text x="279" y="345" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#8B949E" text-anchor="middle">◆ Express</text>

    <!-- Python @ 225° ≈ cx541, cy341 -->
    <circle cx="541" cy="341" r="24" fill="url(#nodeBg)" stroke="#3776AB" stroke-width="1.2"/>
    <circle cx="541" cy="341" r="24" fill="none" stroke="#3776AB" stroke-width="1.2" filter="url(#nodeGlow)" opacity="0.45"/>
    <text x="541" y="345" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#3776AB" text-anchor="middle">🐍 Python</text>

    <!-- Firebase @ 180° → cx225, cy210 -->
    <circle cx="225" cy="210" r="24" fill="url(#nodeBg)" stroke="#FFCA28" stroke-width="1.2"/>
    <circle cx="225" cy="210" r="24" fill="none" stroke="#FFCA28" stroke-width="1.2" filter="url(#nodeGlow)" opacity="0.45"/>
    <text x="225" y="214" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#FFCA28" text-anchor="middle">🔥 Firebase</text>

    <!-- Java @ 0° → cx595, cy210 -->
    <circle cx="595" cy="210" r="24" fill="url(#nodeBg)" stroke="#ED8B00" stroke-width="1.2"/>
    <circle cx="595" cy="210" r="24" fill="none" stroke="#ED8B00" stroke-width="1.2" filter="url(#nodeGlow)" opacity="0.45"/>
    <text x="595" y="214" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#ED8B00" text-anchor="middle">☕ Java</text>
  </g>

  <!-- ===================== OUTER RING NODES (Cloud+Tools, r=195) ===================== -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="45 410 210;405 410 210" dur="110s" repeatCount="indefinite"/>

    <!-- GCP @ 0° cx605 cy210 -->
    <circle cx="605" cy="210" r="26" fill="url(#nodeBg)" stroke="#4285F4" stroke-width="1.3"/>
    <circle cx="605" cy="210" r="26" fill="none" stroke="#4285F4" stroke-width="1.3" filter="url(#nodeGlow)" opacity="0.4"/>
    <text x="605" y="207" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#4285F4" text-anchor="middle">☁️ Google</text>
    <text x="605" y="219" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#4285F4" text-anchor="middle">Cloud</text>

    <!-- Docker @ 90° cx410 cy405 -->
    <circle cx="410" cy="405" r="26" fill="url(#nodeBg)" stroke="#2496ED" stroke-width="1.3"/>
    <circle cx="410" cy="405" r="26" fill="none" stroke="#2496ED" stroke-width="1.3" filter="url(#nodeGlow)" opacity="0.4"/>
    <text x="410" y="402" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#2496ED" text-anchor="middle">🐳 Docker</text>
    <text x="410" y="414" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#2496ED" text-anchor="middle">K8s</text>

    <!-- Git @ 180° cx215 cy210 -->
    <circle cx="215" cy="210" r="26" fill="url(#nodeBg)" stroke="#F05032" stroke-width="1.3"/>
    <circle cx="215" cy="210" r="26" fill="none" stroke="#F05032" stroke-width="1.3" filter="url(#nodeGlow)" opacity="0.4"/>
    <text x="215" y="214" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#F05032" text-anchor="middle">⎇ Git</text>

    <!-- MySQL @ 270° cx410 cy15 -->
    <circle cx="410" cy="15" r="26" fill="url(#nodeBg)" stroke="#4479A1" stroke-width="1.3"/>
    <circle cx="410" cy="15" r="26" fill="none" stroke="#4479A1" stroke-width="1.3" filter="url(#nodeGlow)" opacity="0.4"/>
    <text x="410" y="12" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#4479A1" text-anchor="middle">🛢 MySQL</text>
    <text x="410" y="24" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#4479A1" text-anchor="middle">Postgres</text>
  </g>

  <!-- ===================== FLOATING PARTICLES ===================== -->
  <circle cx="50"  cy="60"  r="1.2" fill="#00FFD1" opacity="0.0"><animate attributeName="opacity" values="0;0.6;0" dur="3.5s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="80"  r="0.9" fill="#7B61FF" opacity="0.0"><animate attributeName="opacity" values="0;0.5;0" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></circle>
  <circle cx="40"  cy="360" r="1.0" fill="#00D4FF" opacity="0.0"><animate attributeName="opacity" values="0;0.4;0" dur="4.2s" begin="0.7s" repeatCount="indefinite"/></circle>
  <circle cx="780" cy="350" r="1.1" fill="#FFD700" opacity="0.0"><animate attributeName="opacity" values="0;0.5;0" dur="3.1s" begin="2.0s" repeatCount="indefinite"/></circle>
  <circle cx="100" cy="200" r="0.8" fill="#00FFD1" opacity="0.0"><animate attributeName="opacity" values="0;0.4;0" dur="2.9s" begin="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="720" cy="220" r="0.8" fill="#7B61FF" opacity="0.0"><animate attributeName="opacity" values="0;0.4;0" dur="3.7s" begin="0.9s" repeatCount="indefinite"/></circle>

  <!-- Title label -->
  <text x="410" y="400" font-family="'JetBrains Mono', monospace" font-size="10" fill="#30363D" text-anchor="middle" letter-spacing="4">// TECH ORBIT · FULL STACK · CLOUD</text>
</svg>
