<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="820" height="420" viewBox="0 0 820 420">
  <defs>
    <!-- Core gradients -->
    <radialGradient id="coreBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a0a2e"/>
      <stop offset="40%"  stop-color="#0d1628"/>
      <stop offset="100%" stop-color="#060b16"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#39FF14">
        <animate attributeName="stop-color" values="#39FF14;#00FF66;#ADFF2F;#39FF14" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ADFF2F">
        <animate attributeName="stop-color" values="#ADFF2F;#39FF14;#00FF66;#ADFF2F" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="nodeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a1f35"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    
    <radialGradient id="nodeGlowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ADFF2F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="heavyGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 3D Orbit Paths -->
    <!-- Orbit 1 (Frontend): rx=160, ry=65 -->
    <!-- M(cx-rx, cy) A(rx,ry) 0 1,1 (cx+rx, cy) A(rx,ry) 0 1,1 (cx-rx, cy) -->
    <!-- cx=410, cy=210. cx-160 = 250. cx+160 = 570 -->
    <path id="orbit1" d="M 250,210 A 160,65 0 1,1 570,210 A 160,65 0 1,1 250,210 Z"/>
    
    <!-- Orbit 2 (Backend): rx=260, ry=105 (Counter-Clockwise -> sweep 0) -->
    <!-- cx-260 = 150. cx+260 = 670 -->
    <path id="orbit2" d="M 150,210 A 260,105 0 1,0 670,210 A 260,105 0 1,0 150,210 Z"/>
    
    <!-- Orbit 3 (Cloud): rx=350, ry=145 -->
    <!-- cx-350 = 60. cx+350 = 760 -->
    <path id="orbit3" d="M 60,210 A 350,145 0 1,1 760,210 A 350,145 0 1,1 60,210 Z"/>
  </defs>

  <rect width="820" height="420" fill="url(#coreBg)"/>

  <!-- Isometric Tech Grid Background -->
  <pattern id="isoGrid" width="60" height="34.64" patternUnits="userSpaceOnUse" patternTransform="translate(10, 10)">
    <path d="M 30,0 L 60,17.32 L 30,34.64 L 0,17.32 Z" fill="none" stroke="#ADFF2F" stroke-width="0.3" opacity="0.1"/>
  </pattern>
  <rect width="820" height="420" fill="url(#isoGrid)"/>
  
  <!-- Glowing Constellation Points in background -->
  <circle cx="200" cy="100" r="1.5" fill="#39FF14" opacity="0.4"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="650" cy="90" r="2" fill="#ADFF2F" opacity="0.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="150" cy="320" r="1.5" fill="#00FF66" opacity="0.3"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="330" r="2.5" fill="#FFD700" opacity="0.4"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.5s" repeatCount="indefinite"/></circle>

  <!-- ===================== ORBIT RINGS (Visual paths) ===================== -->
  <!-- Ring 1 -->
  <ellipse cx="410" cy="210" rx="160" ry="65" fill="none" stroke="#39FF14" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4"/>
  <ellipse cx="410" cy="210" rx="160" ry="65" fill="none" stroke="#39FF14" stroke-width="0.5" filter="url(#glow)" opacity="0.6"/>

  <!-- Ring 2 -->
  <ellipse cx="410" cy="210" rx="260" ry="105" fill="none" stroke="#ADFF2F" stroke-width="1.2" stroke-dasharray="8 12" opacity="0.3"/>
  <ellipse cx="410" cy="210" rx="260" ry="105" fill="none" stroke="#ADFF2F" stroke-width="0.5" filter="url(#glow)" opacity="0.5"/>

  <!-- Ring 3 -->
  <ellipse cx="410" cy="210" rx="350" ry="145" fill="none" stroke="#00FF66" stroke-width="1" stroke-dasharray="2 10" opacity="0.25"/>
  <ellipse cx="410" cy="210" rx="350" ry="145" fill="none" stroke="#00FF66" stroke-width="0.4" filter="url(#glow)" opacity="0.4"/>

  <!-- Ring Labels (Isometric angled) -->
  <g transform="skewX(-30)">
    <text x="730" y="115" font-family="'JetBrains Mono', monospace" font-size="9" fill="#39FF14" opacity="0.6" letter-spacing="2">FRONTEND</text>
    <text x="830" y="145" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ADFF2F" opacity="0.5" letter-spacing="2">BACKEND</text>
    <text x="920" y="175" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00FF66" opacity="0.4" letter-spacing="2">CLOUD + TOOLS</text>
  </g>

  <!-- ===================== CENTER REACTOR CORE ===================== -->
  <g transform="translate(410, 210)">
    <!-- Deep Core Glow -->
    <circle cx="0" cy="0" r="50" fill="url(#nodeGlow)" filter="url(#heavyGlow)"/>
    
    <!-- Outer Hexagon -->
    <polygon points="0,-45 38.97,-22.5 38.97,22.5 0,45 -38.97,22.5 -38.97,-22.5" fill="none" stroke="#39FF14" stroke-width="1.5" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="15s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- Inner Hexagon (Counter-rotating) -->
    <polygon points="0,-35 30.31,-17.5 30.31,17.5 0,35 -30.31,17.5 -30.31,-17.5" fill="none" stroke="#ADFF2F" stroke-width="2" opacity="0.9" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="10s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- Center Tech Triangle -->
    <polygon points="0,-20 17.32,10 -17.32,10" fill="none" stroke="#00FF66" stroke-width="2.5" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="5s" repeatCount="indefinite"/>
    </polygon>

    <!-- Base Center Circle -->
    <circle cx="0" cy="0" r="28" fill="#090d16" stroke="#39FF14" stroke-width="1.5"/>
    
    <!-- Core Text -->
    <text x="0" y="-3" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="url(#nameGrad)" text-anchor="middle" letter-spacing="3" filter="url(#glow)">RAJATH</text>
    <text x="0" y="-3" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="url(#nameGrad)" text-anchor="middle" letter-spacing="3">RAJATH</text>
    <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8B949E" text-anchor="middle" letter-spacing="2">KIRAN A</text>
  </g>

  <!-- ===================== NODES ===================== -->

  <!-- ORBIT 1: FRONTEND (4 Nodes, 40s duration -> 10s offset) -->
  <!-- React -->
  <g>
    <animateMotion dur="40s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#orbit1"/></animateMotion>
    <circle cx="0" cy="0" r="30" fill="url(#nodeGlow)" filter="url(#glow)" opacity="0.6"/>
    <circle cx="0" cy="0" r="18" fill="url(#nodeBg)" stroke="#39FF14" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#61DAFB" text-anchor="middle">⚛ React</text>
  </g>
  <!-- Next.js -->
  <g>
    <animateMotion dur="40s" begin="-10s" repeatCount="indefinite"><mpath xlink:href="#orbit1"/></animateMotion>
    <circle cx="0" cy="0" r="18" fill="url(#nodeBg)" stroke="#39FF14" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#E6EDF3" text-anchor="middle">▲ Next.js</text>
  </g>
  <!-- Tailwind -->
  <g>
    <animateMotion dur="40s" begin="-20s" repeatCount="indefinite"><mpath xlink:href="#orbit1"/></animateMotion>
    <circle cx="0" cy="0" r="18" fill="url(#nodeBg)" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#06B6D4" text-anchor="middle">🌊 Tailwind</text>
  </g>
  <!-- TypeScript -->
  <g>
    <animateMotion dur="40s" begin="-30s" repeatCount="indefinite"><mpath xlink:href="#orbit1"/></animateMotion>
    <circle cx="0" cy="0" r="18" fill="url(#nodeBg)" stroke="#3178C6" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#3178C6" text-anchor="middle">TS TypeScript</text>
  </g>


  <!-- ORBIT 2: BACKEND (6 Nodes, 60s duration -> 10s offset) CCW motion! -->
  <!-- Node.js -->
  <g>
    <animateMotion dur="60s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#orbit2"/></animateMotion>
    <circle cx="0" cy="0" r="35" fill="url(#nodeGlowViolet)" filter="url(#glow)" opacity="0.6"/>
    <circle cx="0" cy="0" r="22" fill="url(#nodeBg)" stroke="#339933" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#339933" text-anchor="middle">⬡ Node.js</text>
  </g>
  <!-- MongoDB -->
  <g>
    <animateMotion dur="60s" begin="-10s" repeatCount="indefinite"><mpath xlink:href="#orbit2"/></animateMotion>
    <circle cx="0" cy="0" r="22" fill="url(#nodeBg)" stroke="#47A248" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#47A248" text-anchor="middle">🍃 MongoDB</text>
  </g>
  <!-- Express -->
  <g>
    <animateMotion dur="60s" begin="-20s" repeatCount="indefinite"><mpath xlink:href="#orbit2"/></animateMotion>
    <circle cx="0" cy="0" r="22" fill="url(#nodeBg)" stroke="#8B949E" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#8B949E" text-anchor="middle">◆ Express</text>
  </g>
  <!-- Python -->
  <g>
    <animateMotion dur="60s" begin="-30s" repeatCount="indefinite"><mpath xlink:href="#orbit2"/></animateMotion>
    <circle cx="0" cy="0" r="22" fill="url(#nodeBg)" stroke="#3776AB" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#3776AB" text-anchor="middle">🐍 Python</text>
  </g>
  <!-- Firebase -->
  <g>
    <animateMotion dur="60s" begin="-40s" repeatCount="indefinite"><mpath xlink:href="#orbit2"/></animateMotion>
    <circle cx="0" cy="0" r="22" fill="url(#nodeBg)" stroke="#FFCA28" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#FFCA28" text-anchor="middle">🔥 Firebase</text>
  </g>
  <!-- Java -->
  <g>
    <animateMotion dur="60s" begin="-50s" repeatCount="indefinite"><mpath xlink:href="#orbit2"/></animateMotion>
    <circle cx="0" cy="0" r="22" fill="url(#nodeBg)" stroke="#ED8B00" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#ED8B00" text-anchor="middle">☕ Java</text>
  </g>


  <!-- ORBIT 3: CLOUD + TOOLS (4 Nodes, 80s duration -> 20s offset) CW motion! -->
  <!-- GCP -->
  <g>
    <animateMotion dur="80s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#orbit3"/></animateMotion>
    <circle cx="0" cy="0" r="24" fill="url(#nodeBg)" stroke="#4285F4" stroke-width="1.5"/>
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#4285F4" text-anchor="middle">☁️ Google</text>
    <text x="0" y="10" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#4285F4" text-anchor="middle">Cloud</text>
  </g>
  <!-- Docker -->
  <g>
    <animateMotion dur="80s" begin="-20s" repeatCount="indefinite"><mpath xlink:href="#orbit3"/></animateMotion>
    <circle cx="0" cy="0" r="24" fill="url(#nodeBg)" stroke="#2496ED" stroke-width="1.5"/>
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#2496ED" text-anchor="middle">🐳 Docker</text>
    <text x="0" y="10" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#2496ED" text-anchor="middle">K8s</text>
  </g>
  <!-- Git -->
  <g>
    <animateMotion dur="80s" begin="-40s" repeatCount="indefinite"><mpath xlink:href="#orbit3"/></animateMotion>
    <circle cx="0" cy="0" r="24" fill="url(#nodeBg)" stroke="#F05032" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#F05032" text-anchor="middle">⎇ Git</text>
  </g>
  <!-- MySQL / Postgres -->
  <g>
    <animateMotion dur="80s" begin="-60s" repeatCount="indefinite"><mpath xlink:href="#orbit3"/></animateMotion>
    <circle cx="0" cy="0" r="24" fill="url(#nodeBg)" stroke="#4479A1" stroke-width="1.5"/>
    <text x="0" y="-1" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="700" fill="#4479A1" text-anchor="middle">🛢 MySQL</text>
    <text x="0" y="9" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="700" fill="#4479A1" text-anchor="middle">Postgres</text>
  </g>

  <!-- Title Footer -->
  <text x="410" y="405" font-family="'JetBrains Mono', monospace" font-size="10" fill="#30363D" text-anchor="middle" letter-spacing="4">// TECH ORBIT · 3D ISOMETRIC · REACTOR CORE</text>
</svg>
