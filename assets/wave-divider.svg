<svg width="1200" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFD1;stop-opacity:0.8">
        <animate attributeName="stop-color" values="#00FFD1;#7B61FF;#00D4FF;#00FFD1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#7B61FF;stop-opacity:0.6">
        <animate attributeName="stop-color" values="#7B61FF;#00D4FF;#00FFD1;#7B61FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0.8">
        <animate attributeName="stop-color" values="#00D4FF;#00FFD1;#7B61FF;#00D4FF" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:0.3">
        <animate attributeName="stop-color" values="#FF6B35;#FFD700;#FF6B35" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.3">
        <animate attributeName="stop-color" values="#FFD700;#FF6B35;#FFD700" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Particle dots -->
    <circle id="particle" r="1.5" fill="#00FFD1" opacity="0.6"/>
  </defs>
  
  <!-- Background fade -->
  <rect width="1200" height="120" fill="transparent"/>
  
  <!-- Wave 3 - back, subtle -->
  <path fill="url(#waveGrad2)" opacity="0.4">
    <animate attributeName="d" 
      values="M0,80 C150,60 350,100 600,70 C850,40 1050,90 1200,60 L1200,120 L0,120 Z;
              M0,70 C150,90 350,50 600,80 C850,110 1050,50 1200,80 L1200,120 L0,120 Z;
              M0,80 C150,60 350,100 600,70 C850,40 1050,90 1200,60 L1200,120 L0,120 Z"
      dur="8s" repeatCount="indefinite"/>
  </path>
  
  <!-- Wave 2 - middle -->
  <path fill="url(#waveGrad)" opacity="0.3">
    <animate attributeName="d" 
      values="M0,90 C200,70 400,110 600,80 C800,50 1000,100 1200,70 L1200,120 L0,120 Z;
              M0,70 C200,100 400,60 600,90 C800,120 1000,60 1200,90 L1200,120 L0,120 Z;
              M0,90 C200,70 400,110 600,80 C800,50 1000,100 1200,70 L1200,120 L0,120 Z"
      dur="6s" repeatCount="indefinite"/>
  </path>
  
  <!-- Wave 1 - front, prominent -->
  <path fill="url(#waveGrad)" opacity="0.6" filter="url(#glow)">
    <animate attributeName="d" 
      values="M0,100 C300,80 600,110 900,85 C1050,75 1150,95 1200,90 L1200,120 L0,120 Z;
              M0,85 C300,105 600,75 900,100 C1050,110 1150,85 1200,95 L1200,120 L0,120 Z;
              M0,100 C300,80 600,110 900,85 C1050,75 1150,95 1200,90 L1200,120 L0,120 Z"
      dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- Animated line on top -->
  <line x1="0" y1="80" x2="1200" y2="80" stroke="url(#waveGrad)" stroke-width="0.5" opacity="0.4">
    <animate attributeName="y1" values="80;75;80" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="80;85;80" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Floating particles -->
  <use href="#particle" x="100" y="90">
    <animate attributeName="y" values="90;70;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </use>
  <use href="#particle" x="300" y="85">
    <animate attributeName="y" values="85;65;85" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
  </use>
  <use href="#particle" x="500" y="95">
    <animate attributeName="y" values="95;75;95" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
  </use>
  <use href="#particle" x="700" y="88">
    <animate attributeName="y" values="88;68;88" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2.8s" repeatCount="indefinite"/>
  </use>
  <use href="#particle" x="900" y="92">
    <animate attributeName="y" values="92;72;92" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.2s" repeatCount="indefinite"/>
  </use>
  <use href="#particle" x="1100" y="87">
    <animate attributeName="y" values="87;67;87" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.8s" repeatCount="indefinite"/>
  </use>
</svg>
